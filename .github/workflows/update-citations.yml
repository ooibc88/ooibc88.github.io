name: Weekly Citation Update
on:
  schedule:
    - cron: "0 0 * * 1"   # 每周一 00:00
  workflow_dispatch:
env:
  SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update citation
        run: python update_citation.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add _i18n/en/pages/about.md _i18n/zh/pages/about.md
            git commit -m "feat: update citation"
            git push origin main
            echo "Pushed changes with updated citation"
          fi
